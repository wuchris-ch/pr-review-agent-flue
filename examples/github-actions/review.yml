name: PR review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  statuses: write
  issues: read
concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull-request }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request && github.event.comment.body == '/review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: wuchris-ch/pr-review-agent-flue@v0.2.0
        with:
          model-key: ${{ secrets.MODEL_GATEWAY_API_KEY }}
          model-url: ${{ secrets.MODEL_GATEWAY_BASE_URL }}
          model: ${{ secrets.REVIEW_AGENT_MODEL }}
