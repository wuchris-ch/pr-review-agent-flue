name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python3 scripts/test-regressions.py
      - run: npm run examples:check
      - run: npm pack --dry-run
      - run: docker build -f Dockerfile.action -t pr-review-action:test .
      - run: npm run build

  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://review:local-review-password@127.0.0.1:55432/reviews
      TEST_POSTGRES_URL: postgresql+psycopg://review:local-review-password@127.0.0.1:55432/reviews
      RUN_DOCKER_TESTS: "1"
      RUN_TEMPORAL_TESTS: "1"
      ALLOW_FIXTURE_PROVIDER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/console/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - run: npm ci && npm run build
      - run: npm ci --prefix apps/console
      - run: npm audit --prefix apps/console --audit-level=high
      - run: npm run lint --prefix apps/console && npm run build --prefix apps/console
      - run: uv sync --project apps/platform --frozen
      - run: uv run --project apps/platform ruff check apps/platform
      - run: docker compose -f deploy/platform.compose.yml up -d --wait
      - run: docker build -t review-platform-runner:local apps/platform/worker_image
      - run: uv run --project apps/platform alembic -c apps/platform/alembic.ini upgrade head
      - run: uv run --project apps/platform pytest apps/platform/tests -q
      - name: Start local platform
        run: |
          uv run --project apps/platform uvicorn review_platform.api:from_environment --factory --host 127.0.0.1 --port 8017 >/tmp/platform-api.log 2>&1 &
          uv run --project apps/platform python -m review_platform.worker >/tmp/platform-worker.log 2>&1 &
          npm run dev --prefix apps/console >/tmp/platform-console.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8017/health && curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: uv run --project apps/platform python scripts/prepare-console-demo.py
      - run: npm exec --prefix apps/console -- playwright install --with-deps chromium
      - run: npm test --prefix apps/console
      - name: Service diagnostics on failure
        if: failure()
        run: |
          docker compose -f deploy/platform.compose.yml ps
          cat /tmp/platform-api.log /tmp/platform-worker.log /tmp/platform-console.log 2>/dev/null || true
      - if: always()
        run: docker compose -f deploy/platform.compose.yml down
